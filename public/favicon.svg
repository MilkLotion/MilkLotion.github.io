  <!--
    파비콘 — RAMA WORKS × GMK Lazurite 아티산 키캡의 금색 윗면 (바탕 없음, 정사각형)
    - 문양은 왼쪽 위 모서리 → 오른쪽 아래 블록 대각선을 기준으로 거울 대칭
      물결 ↔ 갈고리 · 강낭콩 ↔ 하트형 콩 · 고리 ↔ 고리 · 잎은 대각선 위에서 스스로 대칭
    - 모양은 공식 정면 렌더에서 딴 홈 중심선을 원근 보정, 짝은 두 크기의 평균으로 맞춘 뒤 한쪽을 반전
    - 배치는 문양끼리 · 문양과 테 · 문양과 블록 사이의 보이는 간격이 모두 같도록 맞춤
    - 계단 테 2단(위 ↔ 왼쪽 · 오른쪽 ↔ 아래) · 오른쪽 아래 솟은 판도 같은 대각선 대칭
    - 빛은 왼쪽 위(대각선 방향)에서 — 음영도 대칭
  -->
