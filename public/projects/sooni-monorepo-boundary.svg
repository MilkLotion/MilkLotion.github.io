<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="단일 앱을 4앱 7패키지로 분해한 구조도">
  <style>
    .t   { font-family: "IBM Plex Sans","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
    .eb  { font-size: 20px; letter-spacing: .14em; fill: #8593a5; }
    .h1  { font-size: 48px; font-weight: 600; fill: #16202e; letter-spacing: -.01em; }
    .lbl { font-size: 25px; font-weight: 600; fill: #16202e; }
    .sub { font-size: 18px; fill: #6b7787; }
    .dim { font-size: 17px; fill: #8593a5; }
    .mono{ font-family: "IBM Plex Mono","Consolas",monospace; }
    .res { font-size: 27px; font-weight: 600; fill: #16202e; }
    .acc { fill: #1c6b5a; }
  </style>

  <rect width="1600" height="900" fill="#f6f7f9"/>

  <g class="t">
    <text x="90" y="98" class="eb">AICC 상담 데스크 · 모노레포 경계 설계</text>
    <text x="90" y="158" class="h1">단일 앱 → 4앱 7패키지</text>
    <line x1="90" y1="196" x2="1510" y2="196" stroke="#ccd4de" stroke-width="1"/>

    <!-- BEFORE -->
    <rect x="90" y="272" width="270" height="248" rx="4" fill="#e6ebf1" stroke="#ccd4de"/>
    <text x="225" y="378" class="lbl" text-anchor="middle" fill="#6b7787">단일 앱</text>
    <text x="225" y="418" class="dim" text-anchor="middle">권한 · 레이아웃 · 배포 경로</text>
    <text x="225" y="444" class="dim" text-anchor="middle">가 전부 뒤섞임</text>

    <!-- arrow -->
    <text x="465" y="368" class="sub" text-anchor="middle">4단계 점진 분해</text>
    <line x1="392" y1="396" x2="532" y2="396" stroke="#8593a5" stroke-width="2"/>
    <path d="M532 396 L518 389 L518 403 Z" fill="#8593a5"/>
    <text x="465" y="424" class="dim" text-anchor="middle">되돌릴 수 있는 크기로</text>

    <!-- AFTER : 4 apps -->
    <rect x="570" y="272" width="225" height="132" rx="4" fill="#ffffff" stroke="#ccd4de"/>
    <text x="682" y="326" class="lbl" text-anchor="middle" font-size="22">관리자</text>
    <text x="682" y="362" class="mono acc" text-anchor="middle" font-size="26">52</text>
    <text x="682" y="386" class="dim" text-anchor="middle" font-size="15">라우트</text>

    <rect x="808" y="272" width="225" height="132" rx="4" fill="#ffffff" stroke="#ccd4de"/>
    <text x="920" y="326" class="lbl" text-anchor="middle" font-size="22">영업 · QA 데모</text>
    <text x="920" y="362" class="mono acc" text-anchor="middle" font-size="26">40</text>
    <text x="920" y="386" class="dim" text-anchor="middle" font-size="15">라우트</text>

    <rect x="1046" y="272" width="225" height="132" rx="4" fill="#ffffff" stroke="#ccd4de"/>
    <text x="1158" y="326" class="lbl" text-anchor="middle" font-size="22">상담사</text>
    <text x="1158" y="362" class="mono acc" text-anchor="middle" font-size="26">22</text>
    <text x="1158" y="386" class="dim" text-anchor="middle" font-size="15">라우트</text>

    <rect x="1284" y="272" width="225" height="132" rx="4" fill="#ffffff" stroke="#ccd4de"/>
    <text x="1396" y="326" class="lbl" text-anchor="middle" font-size="22">고객 채팅 위젯</text>
    <text x="1396" y="362" class="mono acc" text-anchor="middle" font-size="26">13</text>
    <text x="1396" y="386" class="dim" text-anchor="middle" font-size="15">라우트</text>

    <!-- connectors -->
    <line x1="682"  y1="404" x2="682"  y2="436" stroke="#ccd4de" stroke-width="2"/>
    <line x1="920"  y1="404" x2="920"  y2="436" stroke="#ccd4de" stroke-width="2"/>
    <line x1="1158" y1="404" x2="1158" y2="436" stroke="#ccd4de" stroke-width="2"/>
    <line x1="1396" y1="404" x2="1396" y2="436" stroke="#ccd4de" stroke-width="2"/>

    <!-- shared package layer -->
    <rect x="570" y="436" width="939" height="126" rx="4" fill="#eef1f5" stroke="#ccd4de"/>
    <text x="594" y="474" class="sub" font-weight="600" fill="#16202e">packages/ × 7 — 네 앱이 공유하는 계층</text>
    <rect x="594" y="494" width="392" height="44" rx="4" fill="#e2efea"/>
    <text x="614" y="523" class="mono acc" font-size="19" font-weight="500">@shell</text>
    <text x="700" y="523" class="sub" fill="#1c6b5a">— 프레임 + 세션만 담당하게 좁힘</text>
    <rect x="1000" y="494" width="130" height="44" rx="4" fill="#e6ebf1"/>
    <text x="1020" y="523" class="mono" font-size="19" fill="#6b7787">@data</text>
    <text x="1150" y="523" class="dim">나머지 5개는 도메인별 공유 모듈</text>

    <!-- result -->
    <rect x="90" y="612" width="4" height="74" fill="#1c6b5a"/>
    <text x="116" y="644" class="res">권한 가드를 라우트 단위로 중앙화 → 50여 페이지의 중복 분기 제거</text>
    <text x="116" y="678" class="sub">@shell 을 프레임 + 세션만 담당하게 좁힌 것이 분기점 — 그 경계가 선 뒤에야 앱을 늘려도 공유 계층이 부풀지 않았습니다.</text>

    <line x1="90" y1="762" x2="1510" y2="762" stroke="#ccd4de" stroke-width="1"/>
    <text x="90" y="800" class="dim">라우트 127 = 52 + 40 + 22 + 13 · 소스 1,617파일 / 221,883줄 · 커밋 1,443 / 1,453 (99.3%)</text>
    <text x="90" y="828" class="dim">2026-09-04 git log 스냅샷 기준 · 진행 중인 프로젝트로 현재 HEAD 와 차이가 있습니다</text>
  </g>
</svg>
